<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Chat - Hackathon Catalyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        /* CORE & GLOBAL STYLES */
        body {
            background-image: url('/static/images/Generated Image October 02, 2025 - 10_05PM.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: rgba(15, 23, 42, 0.5);
            background-blend-mode: multiply;
            font-family: 'Major Mono Display', monospace;
            color: #e2e8f0; 
        }

        @import url('https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap');

        

        /* GLASSMORPHISM & NEON */
        .glass-container {
            background-color: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(45, 212, 191, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease-in-out;
        }
        @keyframes neon-border {
            0%, 100% { border-color: rgba(45, 212, 191, 0.4); box-shadow: 0 0 5px rgba(45, 212, 191, 0.2); }
            50% { border-color: rgba(45, 212, 191, 0.8); box-shadow: 0 0 10px rgba(45, 212, 191, 0.4); }
        }
        .neon-border { animation: neon-border 3s ease-in-out infinite; }

        .terminal-input {
            background-color: rgba(30, 41, 59, 0.8) !important;
            border: 1px solid #2dd4bf;
            color: #2dd4bf;
            font-family: 'Major Mono Display', monospace;
            transition: all 0.3s ease-in-out;
            box-shadow: inset 0 0 5px rgba(45, 212, 191, 0.5);
        }
        .terminal-input:focus {
            box-shadow: inset 0 0 10px rgba(45, 212, 191, 0.8), 0 0 15px rgba(45, 212, 191, 0.5);
            outline: none;
        }

        /* Message Animations */
        @keyframes message-slide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .message-fade-in { animation: message-slide 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">
    
    <nav class="glass-container py-4 mb-8 sticky top-0 z-10 shadow-lg">
        <div class="container mx-auto flex justify-between items-center px-4">
            <a href="/" class="text-xl font-bold text-white glitch-text">Hackathon Catalyst</a>
            <div>
                <span class="text-teal-400 mr-4 font-mono text-sm">Logged in as: {{ username }}</span>
                <a href="/" class="text-slate-300 hover:text-white px-3 py-2 rounded-md shimmer-btn">Toolkit</a>
                <a href="/logout" class="bg-red-500/80 hover:bg-red-600 text-white px-3 py-2 rounded-md shimmer-btn text-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl">
        
        <div id="join-section" class="glass-container neon-border p-8 rounded-xl shadow-lg text-center transition-opacity duration-500" data-aos="fade-up">
            <h1 class="text-3xl font-bold mb-4 glitch-text">Secure Team Chat</h1>
            <p class="text-slate-400 mb-6 font-mono">Join your team's encrypted channel.</p>
            
            <div class="space-y-4 max-w-sm mx-auto">
                <input type="text" id="room-input" placeholder="Team Room Name" class="terminal-input w-full rounded-lg p-3">
                <input type="password" id="secret-code-input" placeholder="Secret Code" class="terminal-input w-full rounded-lg p-3">

                <div class="grid grid-cols-2 gap-4">
                    <button id="create-btn" class="bg-blue-600 hover:bg-blue-700 font-bold py-3 px-6 rounded-lg transition-colors shimmer-btn">Create</button>
                    <button id="join-btn" class="bg-teal-500 hover:bg-teal-600 font-bold py-3 px-6 rounded-lg transition-colors shimmer-btn">Join</button>
                </div>
            </div>
            <p id="feedback-message" class="mt-4 text-sm font-mono text-red-400"></p>
        </div>

        <div id="chat-section" class="hidden opacity-0 transition-opacity duration-500" data-aos="zoom-in">
             <h1 id="room-title" class="text-3xl font-bold mb-4 text-center glitch-text"></h1>
            
            <div class="flex flex-col md:flex-row gap-4 h-[500px]">
                
                <div id="chat-window" class="flex-1 glass-container neon-border rounded-lg p-4 overflow-y-auto flex flex-col-reverse">
                    </div>

                <div class="w-full md:w-48 glass-container rounded-lg p-4 border border-slate-700 overflow-y-auto">
                    <h3 class="text-teal-400 font-bold mb-3 border-b border-slate-600 pb-2 text-sm font-mono">Online Members</h3>
                    <ul id="users-list" class="space-y-2 text-sm text-slate-300 font-mono">
                        </ul>
                </div>
            </div>
            
            <div class="flex gap-4 mt-4">
                <input type="text" id="message-input" placeholder="Type your message..." class="terminal-input w-full rounded-lg p-3 focus:ring-2 focus:ring-teal-500">
                <button id="send-btn" class="bg-teal-500 hover:bg-teal-600 font-bold py-3 px-6 rounded-lg shimmer-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, once: true });

        document.addEventListener('DOMContentLoaded', () => {
            const socket = io(); 

            // Elements
            const joinSection = document.getElementById('join-section');
            const chatSection = document.getElementById('chat-section');
            const createBtn = document.getElementById('create-btn');
            const joinBtn = document.getElementById('join-btn');
            const roomInput = document.getElementById('room-input');
            const secretCodeInput = document.getElementById('secret-code-input');
            const feedbackMessage = document.getElementById('feedback-message');
            const roomTitle = document.getElementById('room-title');
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const chatWindow = document.getElementById('chat-window');
            const usersList = document.getElementById('users-list'); // Sidebar list
            
            // JINJA INJECTION: Get the logged-in username securely
            const currentUsername = "{{ username }}"; 
            let currentRoom = ''; 

            // Utility: Copy to Clipboard
            function copyToClipboard(text) {
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = text;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);
            }

            function setFeedback(message, isError = true) {
                feedbackMessage.textContent = message;
                feedbackMessage.className = `mt-4 text-sm font-mono ${isError ? 'text-red-400' : 'text-green-400'}`;
            }

            // Enter Chat Logic
            function enterChat(roomName) {
                currentRoom = roomName;
                
                // Emit join event (Backend handles username via session, but we send team_id)
                socket.emit('join', { team_id: currentRoom, username: currentUsername });
                
                // UI Transition
                joinSection.classList.add('opacity-0');
                setTimeout(() => {
                    joinSection.classList.add('hidden');
                    chatSection.classList.remove('hidden');
                    chatSection.classList.add('opacity-100');
                }, 500);
                
                roomTitle.textContent = `Room: ${currentRoom}`;
            }

            // --- EVENT LISTENERS ---

            createBtn.addEventListener('click', async () => {
                const roomName = roomInput.value.trim();
                const secretCode = secretCodeInput.value.trim();
                
                if (!roomName || !secretCode) {
                    setFeedback('Room name and Secret Code are required.');
                    return;
                }
                
                setFeedback('Creating room...', false);

                try {
                    const response = await fetch('/api/create_room', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ room_name: roomName, secret_code: secretCode })
                    });

                    const data = await response.json();
                    
                    if (response.ok) {
                        copyToClipboard(data.secret_code);
                        setFeedback(`Room created! Code '${data.secret_code}' copied.`, false);
                        enterChat(data.room_name);
                    } else {
                        setFeedback(data.error, true);
                    }
                } catch (error) {
                    setFeedback('Server error.', true);
                }
            });

            joinBtn.addEventListener('click', async () => {
                const roomName = roomInput.value.trim();
                const secretCode = secretCodeInput.value.trim();

                if (!roomName || !secretCode) {
                    setFeedback('Enter Room Name and Secret Code.');
                    return;
                }

                setFeedback('Verifying...', false);

                try {
                    const response = await fetch('/api/join_room', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ room_name: roomName, secret_code: secretCode })
                    });
                    
                    const data = await response.json();

                    if (response.ok) {
                        setFeedback('Success!', false);
                        enterChat(data.room_name); 
                    } else {
                        setFeedback(data.error, true);
                    }
                } catch (error) {
                    setFeedback('Server error.', true);
                }
            });

            // --- SOCKET EVENTS ---

            // 1. Status Messages (Italic gray text)
            socket.on('status', (data) => {
                chatWindow.insertAdjacentHTML('afterbegin', `<p class="text-xs text-slate-500 italic text-center my-1 message-fade-in">${data.msg}</p>`);
            });

            // 2. New Message (With Timezone Fix)
            
            // 2. New Message (With Timezone Fix)
// FIXED: We use .off() to remove any previous listeners before adding a new one
socket.off('new_message').on('new_message', (data) => {
    
    // The server now sends "11:05 AM" directly in data.timestamp
    const isMe = data.username === "{{ username }}"; 
    const nameColor = isMe ? 'text-teal-400' : 'text-cyan-400';

    const messageEl = `
        <div class="mb-3 message-fade-in">
            <p>
                <strong class="${nameColor}">${data.username}</strong> 
                <span class="text-xs text-slate-300 ml-2 font-mono opacity-70">${data.timestamp}</span>
            </p>
            <div class="bg-slate-700/80 p-3 rounded-lg inline-block max-w-xl text-white border border-slate-600 font-mono text-sm">
                ${data.message}
            </div>
        </div>`;
    chatWindow.insertAdjacentHTML('afterbegin', messageEl);
});

            // 3. Update User List (Sidebar)
            socket.on('update_user_list', (data) => {
                usersList.innerHTML = ''; // Clear list
                data.users.forEach(user => {
                    const li = document.createElement('li');
                    li.className = "flex items-center animate-pulse";
                    li.innerHTML = `<span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-2 shadow-[0_0_5px_#22c55e]"></span> ${user}`;
                    usersList.appendChild(li);
                });
            });
            
            function sendMessage() {
                const message = messageInput.value.trim();
                if (message) {
                    socket.emit('send_message', { team_id: currentRoom, message: message });
                    messageInput.value = '';
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => (e.key === 'Enter') && sendMessage());
        });
    </script>
</body>
</html>
